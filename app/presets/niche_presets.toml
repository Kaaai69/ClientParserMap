# Наборы ниш для запуска пачкой. Правьте свободно: файл читается на старте
# и не требует изменения кода. Каждая ниша — отдельный запуск поиска.
#
# id      — латиницей, используется в API.
# title   — как называется в консоли.
# queries — поисковые запросы; ровно то, что вы набрали бы руками.

[[preset]]
id = "small_business"
title = "Малый бизнес"
queries = [
  "детейлинг",
  "шиномонтаж",
  "автосервис",
  "барбершоп",
  "салон красоты",
  "маникюр",
  "стоматология",
  "ветеринарная клиника",
  "кафе",
  "пекарня",
  "фитнес-клуб",
  "клининг",
  "ремонт квартир",
  "ремонт техники",
  "автошкола",
]


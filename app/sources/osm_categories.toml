# Перевод ниши в теги OpenStreetMap.
#
# Без него источник ищет слово в названии компании, а это мимо: в Москве
# 888 автосервисов по тегу shop=car_repair и только 44 со словом
# «автосервис» в названии. Теги ловят категорию целиком.
#
# queries   — как нишу пишут в форме поиска (в нижнем регистре).
# selectors — теги OSM вида "ключ=значение"; объект попадает в выдачу,
#             если совпал хотя бы один.
#
# Ниша, которой здесь нет, ищется по тексту названия — как раньше.

[[category]]
queries = ["детейлинг", "автодетейлинг", "детейлинг авто", "detailing", "car detailing"]
selectors = ["amenity=car_wash", "shop=car_repair"]


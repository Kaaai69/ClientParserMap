[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "client-parser-map"
version = "0.1.0"
description = "Contact-first lead discovery pipeline for Nyraflow"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.179,<3",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "phonenumbers>=9.0,<10",
  "pydantic-settings>=2.10,<3",
  "rapidfuzz>=3.13,<4",
  "redis>=6.4,<7",
  "rq>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=25.4,<26",
  "tldextract>=5.3,<6",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
client-parser = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["RUF001", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "rq.*", "tldextract.*"]
ignore_missing_imports = true
